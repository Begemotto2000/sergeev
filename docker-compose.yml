version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: sergeyev-postgres
    environment:
      POSTGRES_DB: analyzer_db
      POSTGRES_USER: analyzer
      POSTGRES_PASSWORD: analyzer2026
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U analyzer"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sergeyev-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: sergeyev-redis
    command: redis-server --appendonly yes --requirepass redis2026
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sergeyev-network

  # Qdrant Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: sergeyev-qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    environment:
      QDRANT_API_KEY: qdrant-api-key-2026
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sergeyev-network

  # Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sergeyev-app
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://analyzer:analyzer2026@postgres:5432/analyzer_db
      REDIS_URL: redis://:redis2026@redis:6379
      QDRANT_URL: http://qdrant:6333
      PORT: 3000
      JWT_SECRET: super-secret-jwt-key-change-in-production-2026
      VITE_APP_ID: sergeyev-search
      OAUTH_SERVER_URL: https://api.manus.im
      VITE_OAUTH_PORTAL_URL: https://oauth.manus.im
      OWNER_NAME: Sergeyev
      OWNER_OPEN_ID: sergeyev-001
      BUILT_IN_FORGE_API_URL: https://api.manus.im
      BUILT_IN_FORGE_API_KEY: demo-key
      VITE_FRONTEND_FORGE_API_URL: https://api.manus.im
      VITE_FRONTEND_FORGE_API_KEY: demo-key
      VITE_APP_TITLE: Sergeyev Search System
      VITE_APP_LOGO: /logo.svg
      VITE_ANALYTICS_ENDPOINT: https://analytics.manus.im
      VITE_ANALYTICS_WEBSITE_ID: sergeyev-001
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ./:/app
      - /app/node_modules
    networks:
      - sergeyev-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: sergeyev-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    networks:
      - sergeyev-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local

networks:
  sergeyev-network:
    driver: bridge
