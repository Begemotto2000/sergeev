services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BASE_PATH: /100
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=mysql://analyzer:analyzer2026@mysql:3306/analyzer_db
      - REDIS_URL=redis://redis:6379
      - QDRANT_URL=http://qdrant:6333
      - ADMIN_PASSWORD=Nokia3310
      - DOMAIN=46.8.255.137/100
      - BASE_PATH=/100
      - OAUTH_SERVER_URL=https://api.manus.im
      - VITE_OAUTH_PORTAL_URL=
      - VITE_APP_ID=
    depends_on:
      - mysql
      - redis
      - qdrant
    networks:
      - moscow-network
    restart: always

  mysql:
    image: mysql:8.0
    environment:
      - MYSQL_DATABASE=analyzer_db
      - MYSQL_USER=analyzer
      - MYSQL_PASSWORD=analyzer2026
      - MYSQL_ROOT_PASSWORD=analyzer_root_2026
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - moscow-network
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
    networks:
      - moscow-network
    restart: always

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - moscow-network
    restart: always


volumes:
  mysql_data:
  redis_data:
  qdrant_data:

networks:
  moscow-network:
    driver: bridge
